# Ce site a déménagé vers https://ah6259.github.io/prix-eaux-tunisie/
# Ce workflow ne fait plus que publier les pages de redirection (plus de
# relevé de prix quotidien ici — il vit dans le dépôt prix-eaux-tunisie).
name: Déploiement (redirection)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@v4
